<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,400;0,600;0,700;0,800;1,100;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contacto</title>
    
</head>
<body>
      <header>
        <div class=" div-logo"> <a class="logo" href="../index.html" > <img src="../img/RGO.png" alt="floreria RGO" class="img-logo">FLORERIA RGO</a></div>

        <nav class="header-nav">
            <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <section class="contacto">
            <h1 class="titulo-contacto text-secondary">Contactanos</h1> 
        <form class="formulario-contacto" action="https://formspree.io/f/maeqqqrj" method="post">

        <div class="campo-form">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="Nombre" required>
                </div>

                <div class="campo-form">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="Apellido" required>
                </div>

                <div class="campo-form">
                    <label for="email">Correo:</label>
                    <input type="email" id="email" name="Email" required>
                </div>

                <div class="campo-form">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="Mensaje" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn bg-secondary text-dark">Enviar</button>

            </form>
        </section>


    </main>
    <footer>
      <p>Sitio Realizado por Rosalba para Talento Tesh</p>
      <nav>
        <ul class="footer-list">
          <li><img src="../img/whatsapp_1384055.png" alt="logo whatsapp"/></li>
          <li><img src="../img/social_15707749.png" alt="logo instagram"/></li>
        </ul>
      </nav>
    </footer>
</body>
</html>
